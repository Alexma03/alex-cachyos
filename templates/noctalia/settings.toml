config_version = 13

[bar.default]
background_opacity = 0.52999998815357685
capsule = true
capsule_opacity = 0.79999998211860657
capsule_padding = 8.0
capsule_radius = 22
center = [ "control-center", "clock", "media", "weather" ]
concave_edge_corners = false
contact_shadow = true
