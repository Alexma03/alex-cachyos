[plugin_settings."felipeartur/ai-usagebar"]
refresh_minutes = 1

[plugins]
enabled = [ "goodroot/noctwhspr", "felipeartur/ai-usagebar" ]

[shell]
# pkexec UI is Quickshell (qs -c polkit), not Noctalia's agent.
polkit_agent = false
corner_radius_scale = 1.4000000208616257
screen_time_enabled = true
telemetry_enabled = true

    [shell.animation]
    speed = 1.2500000186264515

    [shell.panel]
    borders = false
    floating_offset = 100
    open_near_click_control_center = true
    shadow = false
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 40

[theme]
builtin = "Catppuccin"
community_palette = "One Dark Two"
mode = "auto"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates.user.noctwhspr_mic_osd]
    input_path = "/home/alex/.config/noctalia/templates/noctwhspr-mic-osd.css"
    output_path = "/home/alex/.config/hyprwhspr/theme/mic-osd.css"

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[weather]
refresh_minutes = 5

[widget.bar]
type = "felipeartur/ai-usagebar:bar"
vendor = "openai"

[widget.bluetooth]
show_label = true

[widget.clock]
format = "{:%H:%M:%S}"

[widget.control-center]
glyph = "assembly-filled"

[widget.media]
anchor = true
hide_when_no_media = true
max_length = 150

[widget.network]
show_label = false

[widget.ram]
label_show_units = false

[widget.status]
type = "goodroot/noctwhspr:status"

[widget.weather]
show_condition = false